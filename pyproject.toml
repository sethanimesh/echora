[project]
name = "echora"
version = "0.2.0"
description = "Shared Hinglish language tools for the unified Echora communication assistant"
requires-python = ">=3.12,<3.15"
dependencies = ["regex>=2024.11.6", "wordfreq>=3.1.1"]

[project.optional-dependencies]
groq = ["groq>=0.11.0"]
ollama = ["ollama>=0.4.0"]
haystack = ["haystack-ai>=3.1,<4"]
fish = ["fish-audio-sdk[utils]>=1.3,<2", "requests>=2.32,<3"]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0"]

[project.scripts]
echora = "echora.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["echora*", "communication.backend.hinglish_core*"]
namespaces = true

[tool.setuptools.package-data]
"communication.backend.hinglish_core.data" = ["hi_roman2dev.json"]
"echora" = ["SOURCE.json", "README.md"]
