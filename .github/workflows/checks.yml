name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/reproduce_results.py

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install audio decoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements-dev.txt
          python -m pip install Pillow==12.3.0 opencv-python-headless==5.0.0.93
      - name: Isolated contracts and research tests
        run: python scripts/check_unified.py research/benchmarks/tests research/training/tests

  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        client: [frontend, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.client }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.client }}
      - run: npm test
        working-directory: ${{ matrix.client }}
      - run: npm run typecheck
        working-directory: ${{ matrix.client }}
      - if: matrix.client == 'frontend'
        run: npm run build
        working-directory: frontend
